info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "nome": "Pedro Teste",
        "email": "{{emailArtistaCriado}}",
        "senha": "pedro123",
        "cidade": "Salinas",
        "bio": "Em testes",
        "tecnica": "Aquarela"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.deleteVar("artistaCriadoId");
        bru.deleteVar("tokenDono");
        bru.setVar("emailArtistaCriado", `pedro.teste.${Date.now()}@email.com`);
    - type: after-response
      code: |-
        if (res.getBody().id) {
          bru.setVar("artistaCriadoId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("deve retornar 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("não deve retornar senhaHash", function() {
          expect(res.getBody()).to.not.have.property('senhaHash');
        });

        test("deve retornar id gerado", function() {
          expect(res.getBody()).to.have.property('id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5