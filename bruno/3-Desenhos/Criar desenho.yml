info:
  name: Criar desenho
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/desenhos"
  body:
    type: json
    data: |-
      {
        "titulo": "Estudo de retrato em carvão"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: before-request
      code: bru.deleteVar("desenhoCriadoId");
    - type: after-response
      code: |-
        if (res.getStatus() === 201 && res.getBody().id) {
          bru.setVar("desenhoCriadoId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("deve retornar status 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("deve conter o titulo enviado", function() {
          expect(res.getBody().titulo).to.equal('Estudo de retrato em carvão');
        });

        test("deve retornar id gerado", function() {
          expect(res.getBody()).to.have.property('id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5