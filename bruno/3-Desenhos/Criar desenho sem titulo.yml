info:
  name: Criar desenho sem titulo
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/desenhos"
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 400", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("deve seguir o padrão { erro: '...' }", function() {
          expect(res.getBody()).to.have.property('erro');
        });

        test("deve indicar que titulo é obrigatório", function() {
          expect(res.getBody().erro).to.equal('O campo titulo é obrigatório');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5