info:
  name: Buscar artista
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/artistas/{{artistaCriadoId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("não deve retornar senhaHash", function() {
          expect(res.getBody()).to.not.have.property('senhaHash');
        });

        test("deve retornar o artista correto", function() {
          expect(res.getBody().id).to.equal(Number(bru.getVar('artistaCriadoId')));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5