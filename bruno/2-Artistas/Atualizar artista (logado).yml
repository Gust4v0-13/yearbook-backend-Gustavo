info:
  name: Atualizar artista (logado)
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/artistas/{{artistaCriadoId}}"
  body:
    type: json
    data: |-
      {
        "cidade": "Montes Claros",
        "bio": "Bio atualizada"
      }
  auth:
    type: bearer
    token: "{{tokenDono}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("não deve retornar senhaHash", function() {
          expect(res.getBody()).to.not.have.property('senhaHash');
        });

        test("deve refletir a cidade atualizada", function() {
          expect(res.getBody().cidade).to.equal('Montes Claros');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Requer token do DONO do perfil ({{artistaCriadoId}}).
  Faça login com o artista registrado (Pedro) antes de rodar.